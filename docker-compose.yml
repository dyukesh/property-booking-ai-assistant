version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: property-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-property_db}
      POSTGRES_USER: ${DB_USER:-property_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-property_password}
      PGTZ: ${TZ:-UTC}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - property-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-property_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: property-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${DB_USER:-property_user}:${DB_PASSWORD:-property_password}@db:5432/${DB_NAME:-property_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      BEDROCK_KB_ID: ${BEDROCK_KB_ID}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - property-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
    container_name: property-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
      REACT_APP_ENV: ${REACT_APP_ENV:-development}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    networks:
      - property-network

volumes:
  postgres_data:
    driver: local

networks:
  property-network:
    driver: bridge
